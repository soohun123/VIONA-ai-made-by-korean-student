<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VIONA v8 Mobile</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8eefb;font:15px system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #29324a;gap:10px}h1{font-size:21px;margin:0}small,.hint{color:#9caccb}button{border:0;border-radius:11px;background:#567af2;color:#fff;padding:12px 16px;font:inherit;cursor:pointer}button.secondary{background:#26334e}button:disabled{opacity:.5}main{max-width:960px;margin:auto;padding:16px}#log{height:57vh;overflow-y:auto;overscroll-behavior:contain}.msg{background:#172139;border:1px solid #2c3a56;padding:14px;border-radius:14px;margin:12px 0;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.6}.msg.user{background:#233a62}.who{color:#a9beff;font-weight:700;margin-bottom:6px}form{padding:12px 0}textarea{width:100%;min-height:86px;border:1px solid #455777;border-radius:12px;background:#172139;color:#fff;padding:12px;font:inherit;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}details{border:1px solid #29324a;padding:12px;border-radius:12px;margin:12px 0}label{display:inline-flex;align-items:center;gap:6px;margin:6px}input{width:90px;background:#172139;color:#fff;border:1px solid #455777;border-radius:8px;padding:8px}a{color:#aac0ff}#health{font-size:12px;color:#a7b7d2}@media(max-width:700px){header{padding:12px 14px}h1{font-size:17px}#reset{flex-shrink:0;white-space:nowrap}main{padding:10px 12px 0}#log{height:calc(100vh - 265px);height:calc(100dvh - 265px);min-height:160px}.msg{font-size:14px;padding:11px;margin:8px 0}form{position:sticky;bottom:0;background:#0b1020;padding:8px 0 max(12px,env(safe-area-inset-bottom))}textarea{min-height:54px;max-height:130px;font-size:16px}button{min-height:44px;padding:10px 13px}.hint{font-size:12px}details{font-size:13px}}</style></head><body data-mobile="true"><header><div><h1>✦ VIONA v8 · Mobile</h1><small id="status">서버 확인 중…</small></div><button id="reset" class="secondary">새 대화</button></header><main><p class="hint">같은 AI 엔진 · 터치·저통신량 최적화 · <a href="/">PC 화면</a></p><details><summary>생성 설정 / 서버 상태</summary><label>최대 응답 토큰 <input id="maxTokens" type="number" min="32" max="16384" value="512"></label><label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"></label><p id="health">상태 확인 중…</p><small>모델은 PC 서버에서 실행됩니다. 채팅 기록은 각 브라우저에 별도로 저장됩니다. 컨텍스트 기본 8,192 · 최대 32,768. 최대 응답은 입력과 함께 컨텍스트 안에 들어가야 합니다.</small></details><section id="log" aria-live="polite"></section><form id="form"><textarea id="prompt" placeholder="VIONA에게 질문하기" required></textarea><div class="actions"><button type="button" class="secondary" id="export">기록 내보내기</button><button type="button" class="secondary" id="cancel" hidden>중단</button><button id="send">전송</button></div></form></main><script src="/app.js"></script></body></html>
